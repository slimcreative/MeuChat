name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar plataforma Android 35
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Gerar APK release
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK como release rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="teclado-build-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --draft --target "$GITHUB_SHA" --title "Resposta IA $TAG" \
            --notes "APK release assinado, gerado pelo workflow build-apk."
