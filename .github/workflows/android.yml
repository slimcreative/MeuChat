name: Build APK

# Roda a cada push e também manualmente (aba Actions -> Run workflow)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Permissão de execução no gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MeuChat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
